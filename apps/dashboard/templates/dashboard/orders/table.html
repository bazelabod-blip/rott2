<div class="table-responsive"><table class="table"><thead><tr><th>رقم الطلب</th><th>العميل</th><th>مقدم الخدمة</th><th>الخدمة</th><th>السعر</th><th>الحالة</th><th></th></tr></thead><tbody>{% for o in orders %}<tr><td>{{ o.order_number }}</td><td>{{ o.customer.username }}</td><td>{{ o.provider.username }}</td><td>{{ o.service.title|default:'-' }}</td><td>{{ o.agreed_price }}</td><td><span class="badge text-bg-info">{{ o.get_status_display }}</span></td><td><a href="{% url 'dashboard:order_detail' o.order_number %}" class="btn btn-sm btn-outline-primary">عرض</a></td></tr>{% empty %}<tr><td colspan="7">{% include 'dashboard/partials/empty.html' %}</td></tr>{% endfor %}</tbody></table></div>
