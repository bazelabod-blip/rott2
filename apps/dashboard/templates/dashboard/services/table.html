<div class="table-responsive"><table class="table"><thead><tr><th>الخدمة</th><th>مقدم الخدمة</th><th>السعر</th><th>الحالة</th><th>الطلبات</th><th>التقييم</th></tr></thead><tbody>{% for s in services %}<tr><td>{{ s.title }}</td><td>{{ s.provider.username }}</td><td>{{ s.get_price_display }}</td><td><span class="badge text-bg-info">{{ s.get_status_display }}</span></td><td>{{ s.real_orders|default:s.orders_count }}</td><td>{{ s.average_rating }}</td></tr>{% empty %}<tr><td colspan="6">{% include 'dashboard/partials/empty.html' %}</td></tr>{% endfor %}</tbody></table></div>
