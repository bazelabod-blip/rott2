<div class="table-responsive"><table class="table"><thead><tr><th>العميل</th><th>مقدم الخدمة</th><th>الخدمة</th><th>التقييم</th><th>التعليق</th><th>التاريخ</th></tr></thead><tbody>{% for r in reviews %}<tr><td>{{ r.customer.username }}</td><td>{{ r.provider.username }}</td><td>{{ r.service.title }}</td><td>{{ r.provider_rating }}/5</td><td>{{ r.comment|truncatechars:80 }}</td><td>{{ r.created_at|date:'Y-m-d' }}</td></tr>{% empty %}<tr><td colspan="6">{% include 'dashboard/partials/empty.html' %}</td></tr>{% endfor %}</tbody></table></div>
