{% extends 'base.html' %}

{% block title %}حذف الخدمة - {{ service.title }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <i class="bi bi-exclamation-triangle text-danger" style="font-size: 4rem;"></i>
                    <h4 class="mt-3">تأكيد الحذف</h4>
                    <p class="text-muted">هل أنت متأكد من حذف الخدمة؟</p>
                    <h5 class="fw-bold">{{ service.title }}</h5>

                    <form method="post" class="mt-4">
                        {% csrf_token %}
                        <div class="d-flex gap-2 justify-content-center">
                            <a href="{{ service.get_absolute_url }}" class="btn btn-secondary">
                                <i class="bi bi-x-circle ms-2"></i>
                                إلغاء
                            </a>
                            <button type="submit" class="btn btn-danger">
                                <i class="bi bi-trash ms-2"></i>
                                نعم، احذف
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
