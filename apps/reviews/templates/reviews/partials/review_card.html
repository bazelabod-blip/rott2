<!-- بطاقة تقييم واحد -->
<div class="card shadow-sm mb-3">
    <div class="card-body">
        <div class="d-flex justify-content-between align-items-start">
            <div class="d-flex align-items-center mb-2">
                <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center"
                    style="width: 40px; height: 40px;">
                    <i class="bi bi-person-fill"></i>
                </div>
                <div class="ms-3">
                    <strong>{{ review.customer.username }}</strong>
                    <p class="text-muted small mb-0">{{ review.created_at|date:"Y-m-d" }}</p>
                </div>
            </div>

            <div class="text-end">
                <div class="mb-1">
                    <span class="badge bg-{{ review.rating_color }}">
                        ⭐ {{ review.get_average_rating|floatformat:1 }}
                    </span>
                </div>
                <small class="text-muted">
                    خدمة: {{ review.service_rating }}⭐ | مقدم: {{ review.provider_rating }}⭐
                </small>
            </div>
        </div>

        <p class="mt-3 mb-0">{{ review.comment }}</p>

        {% if review.order %}
        <div class="small text-muted mt-2">
            <i class="bi bi-box"></i> {{ review.service.title }}
        </div>
        {% endif %}
    </div>
</div>
