<!-- بطاقة طلب واحدة -->
<div class="col">
    <div class="card h-100 shadow-sm hover-shadow">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-start mb-2">
                <h6 class="fw-bold mb-0">{{ order.title|truncatewords:6 }}</h6>
                <span class="badge {{ order.get_status_badge_class }}">
                    {{ order.get_status_display }}
                </span>
            </div>

            <p class="text-muted small mb-2">
                <i class="bi bi-hash"></i> {{ order.order_number }}
            </p>

            <p class="text-muted small mb-3">
                {{ order.description|truncatewords:15 }}
            </p>

            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <strong class="text-primary">{{ order.agreed_price }} ريال</strong>
                </div>
                <a href="{{ order.get_absolute_url }}" class="btn btn-sm btn-outline-primary">
                    عرض <i class="bi bi-arrow-left"></i>
                </a>
            </div>

            <div class="small text-muted mt-2">
                <i class="bi bi-calendar"></i> {{ order.created_at|date:"Y-m-d" }}
            </div>
        </div>
    </div>
</div>
